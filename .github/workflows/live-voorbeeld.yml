# Publiceert de map homepage/ als live voorbeeld via GitHub Pages.
# Draait bij elke wijziging op main, of handmatig via het tabblad Actions.
name: Live voorbeeld

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage
      - id: deployment
        uses: actions/deploy-pages@v4
